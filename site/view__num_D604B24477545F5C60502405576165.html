<script type='text/javascript'>
var auth_err_num = 0;
function open_agree_pop()
{
 document.getElementById('layer_agree').style.display = 'block';
}  
function agree_ok()
{
 document.getElementById('layer_agree').style.display = 'none';
 document.getElementById('chk_info').checked = true;
}

    open_agree_pop();
  }  
  */
}  

function get_auth_num()
{
  let phone_num = document.getElementById('B_phone').value;
  $.ajax({
            url:'ajax_auth_phone.php',
            type:'post',            
            data : {
               "phone_num" : phone_num, 
               "mode" : "check"
            },
            
            success:function(data)
            {
              if(data == 'OK')
              {
                document.getElementById('B_auth_num').placeholder = "발급받은 인증번호를 입력하세요";
                document.getElementById('phone_auth_result').innerHTML = "       <span class='blink' >발급받은 인증번호를 입력하세요</span>";
                document.getElementById('get_auth').style.display = 'none';
                document.getElementById('set_auth').style.display = 'inline';                
              }  
              else
              {
                alert(data);
              }  
            }
        });
}  


function check_auth_num()
{
  let auth_num = document.getElementById('B_auth_num').value;
  let phone_num = document.getElementById('B_phone').value;
  $.ajax({
            url:'ajax_auth_phone.php',
            type:'post',            
            data : {
               "phone_num" : phone_num, 
               "auth_num" : auth_num,
               "mode" : "check_auth"
            },
            
            success:function(data)
            {
              if(data == 'OK')
              {
                document.getElementById('next_btn').disabled = false;
                document.getElementById('next_btn').style.background = "";
                document.getElementById('phone_auth_area').style.display = 'none';
                document.getElementById('phone_auth_result').innerHTML = "       <span class='blink' style='color:blue; font-weight:bold;'>인증번호가 확인되었습니다</span>";                
                
              }  
              else
              {
                auth_err_num++;
                if(auth_err_num >= 5)
                {
                  document.getElementById('phone_auth_area').style.display = 'none';
                  document.getElementById('phone_auth_result').innerHTML = "       <span style='color:red; font-weight:bold;'>인증번호가 5회 틀렸습니다.</span>";
                }  
                alert(data);
              }  
            }
        });
}  

var next_ck = false;
function err_msg_layer(err_text)
{
  next_ck = false;
  document.getElementById('layer_err_msg').innerHTML = err_text;  
  document.getElementById('layer_pop_error').style.display = 'block';  
}  

function err_msg_layer_next(err_text)
{
  next_ck = true;
  document.getElementById('layer_err_msg').innerHTML = err_text;  
  document.getElementById('layer_pop_error').style.display = 'block';  
}  


function close_layer()
{
  if(next_ck == true)
  {
    location = 'index.html';
  }  
  else
  {
    document.getElementById('layer_pop_error').style.display = 'none';
  }
}  

</script>
