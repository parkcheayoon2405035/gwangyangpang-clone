<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행운팡팡 챗봇</title>
<!--
  행운팡팡 챗봇 (서버 없이 브라우저에서 동작)
  - 처음 버전(이용가이드 키워드 챗봇)의 화면 구성 — 인사 → 메뉴 4칸 → 말풍선 → 빠른 질문 — 을 이어받았다.
  - 답은 chatbot/rag.js 가 자료(chatbot/kb/*.js)에서 찾아 만든다. 행사가 바뀌면 자료만 바뀐다.
  - 주소 옵션: ?fest=gwangyang|gyeongbuk|wetland (행사)  ?lang=ko|en|ja|zh (화면 언어)  ?embed=1 (사이트 안 창)
  - 위쪽 '시연용 행사 바꾸기'로 같은 질문에 행사마다 답이 바뀌는 것을 보여 줄 수 있다.
-->
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('fonts/PretendardVariable.woff2') format('woff2-variations'), url('fonts/PretendardVariable.woff2') format('woff2');
  font-weight: 45 920; font-display: swap;
}
:root {
  --bg: #0E0D12; --tile: #1C1A22; --tile-2: #26232E; --line: #34303D;
  --text: #FFFFFF; --sub: #A9A4B4; --on-pri: #0E0D12; --on-acc: #0E0D12;
  --pri: #FF3D8B; --acc: #D4FF3A;
  color-scheme: dark;
}
[data-theme="spring"] { --pri: #FF3D8B; --acc: #D4FF3A; }
[data-theme="edu"]    { --pri: #5B7CFF; --acc: #FFE14D; }
[data-theme="eco"]    { --pri: #2EE6A8; --acc: #FF9F45; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
:lang(ja) body { font-family: 'Pretendard', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif; }
:lang(zh) body { font-family: 'Pretendard', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
button, input, select { font: inherit; color: inherit; }

.app { max-width: 520px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

/* 위쪽: 지금 행사 + 시연용 행사 바꾸기 */
.top { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
.top .ava { width: 38px; height: 38px; border-radius: 12px; background: var(--pri); color: var(--on-pri); display: grid; place-items: center; flex: none; }
.top .ava svg { width: 20px; height: 20px; }
.top .who { flex: 1; min-width: 0; line-height: 1.25; }
.top .who b { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .who small { display: block; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.demo span { font-size: 10px; color: var(--sub); font-weight: 700; letter-spacing: .02em; }
.demo select { max-width: 150px; text-overflow: ellipsis; appearance: none; border: 1px solid var(--line); background: var(--tile); border-radius: 999px; padding: 6px 26px 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: right 12px top 50%, right 8px top 50%; background-size: 4px 4px; background-repeat: no-repeat; }

/* 대화 */
.chat { flex: 1; overflow-y: auto; padding: 14px 0 10px; scrollbar-width: thin; }
.row { display: flex; gap: 8px; padding: 4px 14px; align-items: flex-start; }
.row.user { justify-content: flex-end; }
.row .mini { width: 30px; height: 30px; border-radius: 10px; background: var(--tile-2); color: var(--pri); display: grid; place-items: center; flex: none; }
.row .mini svg { width: 16px; height: 16px; }
.bubble { max-width: 82%; padding: 11px 14px; font-size: 14.5px; line-height: 1.6; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
:lang(ja) .bubble, :lang(zh) .bubble { word-break: normal; }
.bot .bubble { background: var(--tile); border-radius: 6px 18px 18px 18px; }
.user .bubble { background: var(--pri); color: var(--on-pri); border-radius: 18px 6px 18px 18px; font-weight: 600; }
.bubble b { color: var(--pri); }
.bubble a { color: var(--text); }
.bubble a.go { display: inline-block; margin-top: 6px; padding: 7px 12px; border-radius: 999px; background: var(--acc); color: var(--on-acc); font-weight: 800; font-size: 13px; text-decoration: none; }
.bubble .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--tile-2); color: var(--sub); font-size: 11.5px; font-weight: 700; vertical-align: 2px; }
.src { display: block; margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--sub); white-space: normal; }
.src::before { content: '📄 '; }

.typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--sub); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }

/* 첫 화면 메뉴 4칸 */
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 14px 4px 52px; }
.menu button { border: 0; border-radius: 16px; background: var(--tile); padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 13.5px; font-weight: 800; line-height: 1.25; }
.menu button:hover { background: var(--tile-2); }
.menu button .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--tile-2); color: var(--pri); display: grid; place-items: center; flex: none; }
.menu button .ic svg { width: 17px; height: 17px; }
.menu button span:last-child { word-break: keep-all; }
:lang(ja) .menu button span:last-child, :lang(zh) .menu button span:last-child { word-break: normal; }

/* 작은 휴대폰(360px 이하): 들여쓰기를 줄이고, 행사 바꾸기 칸은 제목 아래 줄로 */
@media (max-width: 360px) {
  .menu, .chips { padding-left: 14px; }
  .menu button { padding: 10px; gap: 8px; font-size: 13px; }
  .menu button .ic { width: 28px; height: 28px; }
  .top { flex-wrap: wrap; }
  .demo { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; }
  .demo select { max-width: 60%; }
}

/* 빠른 질문 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 6px 52px; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--sub); cursor: pointer; }
.chips button:hover { border-color: var(--pri); color: var(--text); }

/* 입력 */
.input { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,.06); }
.input input { flex: 1; min-width: 0; height: 48px; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 18px; font-size: 15px; outline: none; background: var(--tile); }
.input input::placeholder { color: var(--sub); }
.input input:focus { border-color: var(--pri); }
.input button { width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--acc); color: var(--on-acc); cursor: pointer; display: grid; place-items: center; flex: none; }
.input button svg { width: 20px; height: 20px; }
</style>
<script>
  // 서버 AI 를 쓰게 되면 여기에 주소를 넣는다. (예: '/api/chat') — 비워 두면 자료에서 찾은 내용으로만 답한다.
  window.CHAT_CONFIG = { aiEndpoint: null };
</script>
<script src="chatbot/kb/festivals.js"></script>
<script src="chatbot/kb/common.js"></script>
<script src="chatbot/kb/places-gwangyang.js"></script>
<script src="chatbot/rag.js"></script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ava" aria-hidden="true"></div>
    <div class="who"><b id="title"></b><small id="festName"></small></div>
    <label class="demo"><span id="demoLabel"></span>
      <select id="fest" aria-describedby="demoLabel">
        <option value="gwangyang"></option><option value="gyeongbuk"></option><option value="wetland"></option>
      </select>
    </label>
  </div>
  <div class="chat" id="chat" role="log" aria-live="polite"></div>
  <form class="input" id="form" autocomplete="off">
    <input id="q" type="text" maxlength="200">
    <button type="submit" id="send"></button>
  </form>
</div>
<script>
(function () {
  'use strict';
  var KB = window.CHAT_KB, RAG = window.ChatRAG;
  var LANGS = ['ko', 'en', 'ja', 'zh'];

  /* 화면 언어: 주소 ?lang= → 사이트에서 고른 언어(쿠키) → 한국어 */
  function readCookie(n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
  var qs = new URLSearchParams(location.search);
  var ui = qs.get('lang'); if (LANGS.indexOf(ui) < 0) ui = readCookie('lang'); if (LANGS.indexOf(ui) < 0) ui = 'ko';
  var fest = qs.get('fest'); if (!KB.festivals[fest]) fest = 'gwangyang';
  document.documentElement.lang = { ko: 'ko', en: 'en', ja: 'ja', zh: 'zh-CN' }[ui];

  var T = {
    title: { ko: '행운팡팡 도우미', en: 'Lucky PangPang Helper', ja: 'ラッキーパンパン案内', zh: 'Lucky PangPang 助手' },
    demo: { ko: '시연용 · 행사 바꾸기', en: 'Demo · switch event', ja: 'デモ・イベント切替', zh: '演示 · 切换活动' },
    place: { ko: '궁금한 걸 입력하세요', en: 'Type your question', ja: '質問を入力してください', zh: '请输入问题' },
    send: { ko: '보내기', en: 'Send', ja: '送信', zh: '发送' },
    hi: {
      ko: '안녕하세요! <b>{name}</b> 안내 도우미예요.\n행사 자료에서 찾아서 답해 드려요. 아래에서 고르거나 궁금한 걸 입력해 주세요.',
      en: 'Hi! I\'m the helper for <b>{name}</b>.\nI answer from this event\'s materials. Pick a topic or type a question.',
      ja: 'こんにちは！<b>{name}</b>の案内役です。\nイベント資料から探してお答えします。下から選ぶか、質問を入力してください。',
      zh: '你好！我是<b>{name}</b>的向导。\n我会从活动资料中查找答案。请选择下方话题或输入问题。'
    },
    switched: { ko: '지금부터 <b>{name}</b> 안내예요. 같은 질문을 해 보세요!', en: 'Switched to <b>{name}</b>. Try the same question!', ja: '<b>{name}</b>に切り替えました。同じ質問をしてみてください！', zh: '已切换到<b>{name}</b>，试试问同样的问题！' },
    source: { ko: '근거', en: 'Source', ja: '根拠', zh: '依据' },
    menu: {
      how: { ko: '참여 방법', en: 'How to join', ja: '参加方法', zh: '参与方法' },
      gift: { ko: '선물 받기', en: 'Getting gifts', ja: 'プレゼント', zh: '领取礼品' },
      mypoints: { ko: '내 포인트', en: 'My points', ja: 'マイポイント', zh: '我的积分' },
      food: { ko: '근처 맛집', en: 'Food nearby', ja: '近くの飲食店', zh: '附近美食' },
      event: { ko: '행사 정보', en: 'Event info', ja: 'イベント情報', zh: '活动信息' },
      app: { ko: '앱 설치 필요?', en: 'Need an app?', ja: 'アプリは必要？', zh: '需要下载应用？' }
    },
    foodQ: { ko: '근처 맛집 알려 줘', en: 'Restaurants nearby', ja: '近くの飲食店', zh: '附近的餐厅' }
  };
  function L(v) { return v[ui] != null ? v[ui] : v.ko; }

  var ICON = {
    bot: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h.01M12 9h.01M16 9h.01"/>',
    how: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/>',
    gift: '<path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
    mypoints: '<circle cx="12" cy="12" r="9"/><path d="M9.5 16V8h3.2a2.4 2.4 0 0 1 0 4.8H9.5"/>',
    food: '<path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M17 2c-2 2-3 5-3 8h4v12"/>',
    event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    app: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
    send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>'
  };
  function svg(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>'; }

  var chat = document.getElementById('chat'), form = document.getElementById('form'), input = document.getElementById('q'), sel = document.getElementById('fest');
  document.querySelector('.top .ava').innerHTML = svg('bot');
  document.getElementById('send').innerHTML = svg('send');
  document.getElementById('send').setAttribute('aria-label', L(T.send));
  document.getElementById('title').textContent = L(T.title);
  document.getElementById('demoLabel').textContent = L(T.demo);
  input.placeholder = L(T.place);
  input.setAttribute('aria-label', L(T.place));
  Array.prototype.forEach.call(sel.options, function (o) { o.textContent = L(KB.festivals[o.value].short); });

  function down() { chat.scrollTop = chat.scrollHeight; }
  function addBot(html, src) {
    var row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = '<div class="mini">' + svg('bot') + '</div><div class="bubble">' + html +
      (src ? '<span class="src">' + L(T.source) + ': ' + src + '</span>' : '') + '</div>';
    chat.appendChild(row); down(); return row;
  }
  function addUser(text) {
    var row = document.createElement('div'); row.className = 'row user';
    var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;  // 사용자가 쓴 글은 글자로만
    row.appendChild(b); chat.appendChild(row); down();
  }
  function addChips(ids, lang) {
    if (!ids || !ids.length) return;
    var box = document.createElement('div'); box.className = 'chips';
    ids.forEach(function (id) {
      var t = RAG.chipText(id, lang), b = document.createElement('button');
      b.type = 'button'; b.textContent = t; b.onclick = function () { ask(t); };
      box.appendChild(b);
    });
    chat.appendChild(box); down();
  }
  function addMenu() {
    var f = KB.festivals[fest];
    // 4번째 칸: 장소 자료가 있으면 '근처 맛집', 없으면 '행사 정보' — 그것도 자료에 없으면(기간·장소 모름) '앱 설치?'
    var hasEvent = f.period != null && f.venue != null;
    var fourth = f.places ? ['food', L(T.foodQ)] : hasEvent ? ['event', RAG.chipText('event', ui)] : ['app', RAG.chipText('app', ui)];
    var items = [['how', RAG.chipText('how', ui)], ['gift', RAG.chipText('gift', ui)], ['mypoints', RAG.chipText('mypoints', ui)], fourth];
    var box = document.createElement('div'); box.className = 'menu';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<span class="ic">' + svg(it[0]) + '</span><span>' + L(T.menu[it[0]]) + '</span>';
      b.onclick = function () { ask(it[1]); };
      box.appendChild(b);
    });
    chat.appendChild(box); down();
  }

  function setFest(id, announce) {
    fest = id; sel.value = id;
    var f = KB.festivals[id];
    document.documentElement.setAttribute('data-theme', f.theme);
    document.getElementById('festName').textContent = L(f.name);
    if (announce) { addBot(L(T.switched).replace('{name}', L(f.name))); addMenu(); }
  }

  var busy = false;
  function ask(text) {
    text = String(text).trim().slice(0, 200);
    if (!text || busy) return false;
    busy = true;
    addUser(text);
    var typing = addBot('<span class="typing"><span></span><span></span><span></span></span>');
    var started = Date.now();
    RAG.answer(text, fest, ui).then(function (r) {
      setTimeout(function () {
        typing.remove();
        addBot(r.html, r.source);
        addChips(r.chips, r.lang);
        busy = false;
      }, Math.max(0, 380 - (Date.now() - started)));
    });
    return true;
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); if (ask(input.value)) input.value = ''; input.focus(); });
  sel.addEventListener('change', function () { setFest(sel.value, true); });
  // 사이트 안 창으로 열렸을 때: ESC → 바깥 페이지에 '닫아 줘' 알림
  if (window.parent !== window) {
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') window.parent.postMessage('pp-chat-close', location.origin);
    });
  }

  setFest(fest, false);
  addBot(L(T.hi).replace('{name}', L(KB.festivals[fest].name)));
  addMenu();

  window.ChatUI = { ask: ask, setFest: setFest };   // 시험·발표용
})();
</script>
</body>
</html>
