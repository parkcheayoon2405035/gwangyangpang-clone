<title>행운팡팡 챗봇</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  body { font-family: 'Noto Sans KR', '맑은 고딕', 'Malgun Gothic', sans-serif; color: var(--text); }
  button, input { font-family: inherit; }

  .title .main b { color: var(--magenta); font-weight: 900; }
  .tab { background: var(--gray-bg); text-align: center; font-size: 13px; padding: 9px 0; }

  /* 대화 영역 */
  .chat { flex: 1; overflow-y: auto; padding: 0 0 12px; }
  .banner { background: var(--purple); color: #FFFFFF; padding: 20px; text-align: right; margin-bottom: 12px; }
  .banner .t1 { font-size: 14px; }
  .banner .t2 { font-size: 21px; font-weight: 700; line-height: 1.35; }
  .banner .t3 { font-size: 11px; color: #DCD3FA; margin-top: 4px; }

  .row { display: flex; gap: 8px; padding: 4px 14px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--purple); flex: none;
            display: flex; align-items: center; justify-content: center; }
  .avatar svg { width: 18px; height: 18px; stroke: #FFFFFF; }

            word-break: keep-all; overflow-wrap: anywhere; /* 띄어쓰기 없는 긴 글도 말풍선 안에서 줄바꿈 */ }
  .bot .bubble { background: var(--gray-bg); border-radius: 4px 14px 14px 14px; }
  .user .bubble { background: var(--purple); color: #FFFFFF; border-radius: 14px 4px 14px 14px; }
  .bubble b { color: var(--purple); }

  /* 입력 중 표시 (점 세 개) */

                 background: #B4B2A9; animation: blink 1s infinite; }

<script>

const FALLBACK = {
  answer: "죄송해요, 이용가이드에 없는 내용이에요.\n자세한 내용은 <b>종합안내 7번부스</b>에 문의해 주세요.\n\n이런 걸 물어볼 수 있어요.",
  chips: ["포인트 받는 법", "선물 교환 방법", "포인트 소멸", "커피 쿠폰"]
};

// 첫 화면 메뉴 (버튼 글자, 실제로 보낼 질문, 아이콘)
const MENU = [
  ["포인트 받기", "포인트 받는 법", "qr"],
  ["선물 교환", "선물 교환 방법", "gift"],
  ["포인트 소멸", "포인트 소멸", "clock"],

];

const MIN_SCORE = 3; // 이 점수보다 낮으면 '모르겠어요'로 답해요

/* =====================================================================
   2. 질문에 맞는 답 찾기
   ===================================================================== */
function normalize(text) {
  return text.toLowerCase().replace(/[\s?!.,~·'"()]/g, "");
}

function findAnswer(question) {
  const q = normalize(question);
  let best = null, bestScore = 0;
  for (const item of FAQ) {
    if (item.need && !item.need.some(w => q.includes(normalize(w)))) continue;
    let score = 0;
    for (const [word, point] of item.keywords) {
      if (q.includes(normalize(word))) score += point;
    }
    if (score > bestScore) { best = item; bestScore = score; }
  }
  return bestScore >= MIN_SCORE ? best : FALLBACK;
}

  bot: '<path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 20h4v-3"/>',
  gift: '<path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  coffee: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>'
};
const svg = name => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function addBot(html) {
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = `<div class="avatar">${svg("bot")}</div><div class="bubble">${html}</div>`;
  chat.appendChild(row);
  scrollDown();
  return row;
}

function addUser(text) {
  const row = document.createElement("div");
  row.className = "row user";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text; // 사용자가 쓴 글은 그대로 글자로만 보여줘요 (안전)
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollDown();
}

function addChips(list) {
  if (!list.length) return;
  const box = document.createElement("div");
  box.className = "chips";
  for (const text of list) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.onclick = () => ask(text);
    box.appendChild(b);
  }
  chat.appendChild(box);
  scrollDown();
}

function addMenu() {
  const box = document.createElement("div");
  box.className = "menu";
  for (const [label, question, icon] of MENU) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `${svg(icon)}<span>${label}</span>`;
    b.onclick = () => ask(question);
    box.appendChild(b);
  }
  chat.appendChild(box);
  scrollDown();
}

let busy = false;
function ask(question) {
  question = question.trim().slice(0, 200); // 너무 긴 글은 200자까지만
  if (!question || busy) return false;
  busy = true;
  addUser(question);
  // 잠깐 '입력 중...' 점 세 개를 보여주고 답해요
  const typing = addBot('<span class="typing"><span></span><span></span><span></span></span>');
  setTimeout(() => {
    typing.remove();
    const result = findAnswer(question);
    addBot(result.answer);
    addChips(result.chips);
    busy = false;
  }, 450);
  return true;
}

form.addEventListener("submit", e => {
  e.preventDefault();
  if (ask(input.value)) input.value = ""; // 질문이 접수됐을 때만 입력창을 비워요
  input.focus();
});

// 첫 인사 + 메뉴
addBot("안녕하세요! 행운팡팡 이용 방법을 알려드릴게요.\n아래에서 고르거나 궁금한 걸 직접 입력해 주세요.");
addMenu();
</script>
