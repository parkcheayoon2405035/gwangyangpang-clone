<script type='text/javascript'>

function open_agree_pop()
{
 document.getElementById('layer_agree').style.display = 'block';
}  
function agree_ok()
{
 document.getElementById('layer_agree').style.display = 'none';
 document.getElementById('chk_info').checked = true;
}  


function send_submit()
{
   if(document.getElementById('B_name').value == '')
   {
     err_msg_layer("<b>조회할 수 없습니다.</b><div class='text_h05'></div>이름을 적으세요");
     return;
   }  

   if(document.getElementById('B_phone').value == '')
   {
     err_msg_layer("<b>조회할 수 없습니다.</b><div class='text_h05'></div>연락처를 적으세요");
     return;
   }     
   document.getElementById('send_form').submit();
/* 개인정보 수집동의 삭제
  if(document.getElementById('chk_info').checked == true)
  {
    document.getElementById('send_form').submit();
  }
  else
  {
    alert('개인정보 수집에 동의하셔야됩니다');
    open_agree_pop();
  }  
  */
}  

function get_auth_num()
{
  phone_num = document.getElementById('B_phone').value;
 
  $.ajax({
            url:'ajax_auth_phone.php',
            type:'post',            
            data : {
               "phone_num" : phone_num, 
               "mode" : "check"
            },
            
            success:function(data)
            {
              if(data == 'OK')
              {
                document.getElementById('B_auth_num').placeholder = "발급받은 인증번호를 입력하세요";
              }  
              else
              {
//                alert(data);
                  err_msg_layer(data);
              }  
            }
        });
}  

var next_ck = false;
function err_msg_layer(err_text)
{
  next_ck = false;
  document.getElementById('layer_err_msg').innerHTML = err_text;  
  document.getElementById('layer_pop_error').style.display = 'block';  
}  

function err_msg_layer_next(err_text)
{
  next_ck = true;
  document.getElementById('layer_err_msg').innerHTML = err_text;  
  document.getElementById('layer_pop_error').style.display = 'block';  
}  


function close_layer()
{
  if(next_ck == true)
  {
    location = 'index.html';
  }  
  else
  {
    document.getElementById('layer_pop_error').style.display = 'none';
  }
}  

</script>
